name: Update Flake Inputs

on:
  schedule:
    - cron: '0 2 * * 5'  # At 02:00 on Friday
  workflow_dispatch:

jobs:
  update:
    runs-on: native
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: update flake
      run: nix flake update --commit-lock-file --option access-tokens github.com=${{ secrets.UPDATES_TOKEN }}
    - name: Create Pull Request
      run: bash ./.forgejo/workflows/create-pr.sh
      env:
        FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
